name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "stage-1/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check scripts/migrate.mjs
      - run: node --check api/_lib/entitlements.mjs
      - run: npm run build
